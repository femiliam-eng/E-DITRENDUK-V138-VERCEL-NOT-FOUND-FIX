<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengumpulan Hasil Notulensi — E-DITRENDUK</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/rev14.css?v=145"/>
</head><body data-page="notulen"><div id="appHeader"></div><div id="appSidebar"></div><main class="main"><div class="crumb">E-DITRENDUK · 2026</div><div class="page-head"><div><h1>Pengumpulan Hasil Notulensi</h1><p>Seluruh pegawai dapat mengunggah dokumen hasil rapat yang sudah selesai.</p></div></div><section class="card" style="padding:24px;margin-bottom:22px"><h3>Unggah hasil rapat</h3><form id="submissionForm" class="form-grid"><div class="form-group full"><label for="topic">Judul / agenda rapat</label><input id="topic" class="field" required maxlength="160"></div><div class="form-group"><label for="meetingDate">Tanggal rapat</label><input id="meetingDate" class="field" type="date" required></div><div class="form-group full"><label for="file">Dokumen hasil notulensi (PDF, DOC, DOCX; maks. 6 MB)</label><input id="file" class="field" type="file" accept=".pdf,.doc,.docx" required></div><div class="form-group full"><button class="btn btn-navy" type="submit" id="uploadBtn">Kumpulkan notulensi</button><p id="submissionStatus" role="status"></p></div></form></section><section class="card" style="padding:24px"><h3>Hasil notulensi terkumpul</h3><div class="revisi-tools"><input class="field" id="submissionSearch" type="search" placeholder="Cari judul, tanggal, atau pengunggah…" aria-label="Cari hasil notulensi"><select class="field" id="submissionOrder" aria-label="Urutan tanggal"><option value="desc">Terbaru ke terlama</option><option value="asc">Terlama ke terbaru</option></select></div><div id="submissionList">Memuat...</div></section></main><script src="js/data.js"></script><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/notulen-submissions.js"></script><script src="js/ux.js"></script></body></html>
