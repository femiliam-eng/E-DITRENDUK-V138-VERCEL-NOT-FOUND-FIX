<!DOCTYPE html>
<html lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   RAKOM — E-DITRENDUK
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body data-page="rakom">
  <div id="appHeader">
  </div>
  <div id="appSidebar">
  </div>
  <main class="main">
   <div class="crumb">
    E-DITRENDUK · 2026
   </div>
   <div class="page-head">
    <div>
     <h1>
      RAKOM
     </h1>
     <p>
      Kelola arahan Direktur sebagai tugas yang terukur.
     </p>
    </div>
   </div>
   <section class="card">
    <div class="section-title">
     <div>
      <h3>
       RAKOM / Tindak lanjut
      </h3>
      <span>
       Arahan, PIC, deadline, progres, dan bukti dukung.
      </span>
     </div>
     <button class="btn btn-navy" id="addDirection">
      + Tambah arahan
     </button>
    </div>
    <div class="table-wrap">
     <table class="table">
      <thead>
       <tr>
        <th>
         Output / Tim
        </th>
        <th>
         Arahan Direktur
        </th>
        <th>
         PIC
        </th>
        <th>
         Deadline
        </th>
        <th>
         Status
        </th>
        <th>
         Progres
        </th>
        <th>
         Bukti
        </th>
       </tr>
      </thead>
      <tbody id="rakomBody">
      </tbody>
     </table>
    </div>
   </section>
   <div class="modal-overlay" id="directionModal">
    <div class="modal">
     <div class="modal-head">
      <div>
       <small>
        E-DITRENDUK
       </small>
       <h3>
        Tambah arahan RAKOM
       </h3>
      </div>
      <button class="modal-close" data-close="">
       ×
      </button>
     </div>
     <div class="modal-body">
      <div class="form-grid">
       <div class="form-group">
        <label>
         Tim / output
        </label>
        <input class="field"/>
       </div>
       <div class="form-group">
        <label>
         Arahan Direktur
        </label>
        <textarea class="field"></textarea>
       </div>
       <div class="form-group">
        <label>
         PIC
        </label>
        <input class="field"/>
       </div>
       <div class="form-group">
        <label>
         Deadline
        </label>
        <input class="field" type="date"/>
       </div>
      </div>
     </div>
     <div class="modal-foot">
      <button class="btn btn-outline" data-close="">
       Batal
      </button>
      <button class="btn btn-navy" id="saveDirection">
       Simpan arahan
      </button>
     </div>
    </div>
   </div>
   <div class="modal-overlay" id="proofModal">
    <div class="modal">
     <div class="modal-head">
      <div>
       <small>
        E-DITRENDUK
       </small>
       <h3>
        Bukti dukung RAKOM
       </h3>
      </div>
      <button class="modal-close" data-close="">
       ×
      </button>
     </div>
     <div class="modal-body">
      <h4 id="proofTitle">
      </h4>
      <label>
       Tautan Google Drive
      </label>
      <input class="field" placeholder="https://drive.google.com/..."/>
      <br/>
      <br/>
      <label>
       Catatan
      </label>
      <textarea class="field" placeholder="Keterangan bukti dukung"></textarea>
     </div>
     <div class="modal-foot">
      <button class="btn btn-outline" data-close="">
       Tutup
      </button>
      <button class="btn btn-navy" id="saveProof">
       Simpan bukti
      </button>
     </div>
    </div>
   </div>
  </main>
  <script src="js/data.js">
  </script>
  <script src="js/api.js"></script>
  <script src="js/layout.js">
  </script>
  <script src="js/app.js">
  </script>
  <script src="js/pages/rakom.js"></script>
   <script src="js/v6.js"></script>
   <script src="js/ux.js"></script>
<script src="js/revisi27.js"></script><script src="js/v140-sort.js"></script>
</body>
</html>
