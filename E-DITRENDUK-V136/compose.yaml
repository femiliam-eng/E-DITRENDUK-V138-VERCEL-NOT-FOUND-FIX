# Production-compatible container example. A managed PostgreSQL database and
# private Supabase Storage must already exist; do not use legacy SQLite server.js.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      APP_ORIGIN: ${APP_ORIGIN:?Set the HTTPS public URL}
      DATABASE_URL: ${DATABASE_URL:?Set a PostgreSQL connection string}
      NOTULEN_STORAGE_PROVIDER: supabase
      SUPABASE_URL: ${SUPABASE_URL:?Set the Supabase project URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the server-only key}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-notulen-private}
      AGENDA_STORAGE_BUCKET: ${AGENDA_STORAGE_BUCKET:-agenda-private}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
