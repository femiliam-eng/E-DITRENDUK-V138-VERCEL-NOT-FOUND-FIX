<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jenis Fasilitasi | E-DITRENDUK</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/fasilitasi-v132.css"></head><body data-page="fasilitasi"><div id="appHeader"></div><div id="appSidebar"></div><main class="main"><div class="crumb">E-DITRENDUK · FASILITASI</div><div class="page-head"><div><h1>Jenis Fasilitasi</h1><p>Kelola fasilitasi data, narasumber, metode kegiatan, dan bukti dukung.</p></div></div><section><h2 id="formTitle">Tambah fasilitasi</h2><form id="form"><input type="hidden" id="itemId"><label>Nama kegiatan <input id="judul" required maxlength="200"></label><label>Tanggal <input id="tanggal" type="date" required></label><label>Metode <select id="metode"><option>Offline</option><option>Online</option><option>Hybrid</option></select></label><label>Jenis fasilitasi <select id="jenis"><option>Fasilitasi Data</option><option>Narasumber</option></select></label><label>Narasumber <input id="narasumber" maxlength="200"></label><label>Link bukti dukung (URL dokumen/foto) <input id="bukti" type="url" placeholder="https://..."></label><label>Catatan <textarea id="catatan" rows="3"></textarea></label><div class="actions"><button type="submit">Simpan fasilitasi</button><button type="button" id="cancel">Batal edit</button></div></form><p id="msg" role="status"></p></section><section><h2>Daftar fasilitasi</h2><p id="summary" class="muted" aria-live="polite"></p><div class="fasilitasi-toolbar"><label>Cari <input id="search" placeholder="Cari kegiatan/narasumber"></label><label>Filter jenis fasilitasi <select id="jenisFilter"><option value="">Semua jenis</option><option>Fasilitasi Data</option><option>Narasumber</option></select></label><label>Filter metode <select id="metodeFilter"><option value="">Semua metode</option><option>Offline</option><option>Online</option><option>Hybrid</option></select></label><label>Urutan tanggal <select id="sort"><option value="desc">Terbaru dahulu</option><option value="asc">Terlama dahulu</option></select></label></div><div id="rows" aria-live="polite"></div></section></main><dialog id="confirmDialog" style="border:0;border-radius:16px;max-width:440px;width:calc(100% - 32px);box-shadow:0 15px 70px #0005;padding:25px"><h2>Konfirmasi penghapusan</h2><p id="confirmText"></p><div class="actions"><button type="button" id="confirmCancel" style="background:#64748b">Batal</button><button type="button" id="confirmAccept" class="danger">Ya, hapus</button></div></dialog><script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/fasilitasi.js"></script><script src="js/ux.js"></script></body></html>
